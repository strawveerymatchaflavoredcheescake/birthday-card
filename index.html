<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Matcha!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#4a2340; --sun:#ffc21a; --meadow:#7cb342; --blush:#ff7aa2;
  --cream:#fffaf0; --paper:#fff1f5; --sky:#cfeaff;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --hand:"Caveat","Segoe Script","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; font-family:var(--display); color:var(--plum);
  background:radial-gradient(circle at 20% 15%,#fff3b8 0,transparent 45%),
             radial-gradient(circle at 85% 80%,#ffd1e1 0,transparent 50%),
             #ffe9c9;
  overflow-x:hidden;
}
.screen{display:none;min-height:100vh;padding:24px;flex-direction:column;align-items:center;justify-content:center}
.screen.active{display:flex}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--plum);outline-offset:3px}

/* ---------- login ---------- */
.login{width:min(420px,100%);background:var(--cream);border:3px solid var(--plum);border-radius:28px;
  padding:34px 30px 28px;box-shadow:8px 8px 0 var(--plum);text-align:center;position:relative}
.login .sun{width:84px;height:84px;margin:-76px auto 6px;display:block;animation:spin 18s linear infinite}
.login h1{font-size:2rem;line-height:1.15;margin:6px 0 20px;font-weight:700}
.login label{display:block;text-align:left;font-weight:500;margin:12px 0 6px}
.login input{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2.5px solid var(--plum);background:#fff}
.btn{margin-top:22px;width:100%;padding:13px 18px;font-size:1.1rem;font-weight:700;color:var(--plum);
  background:var(--sun);border:3px solid var(--plum);border-radius:16px;box-shadow:0 5px 0 var(--plum);
  transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--plum)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--plum)}
.error{min-height:1.4em;margin:14px 0 0;color:#c2185b;font-weight:500}
.hint{margin:12px 0 0;font-size:.95rem;opacity:.75}
.hint code{background:#ffe9a8;padding:2px 7px;border-radius:8px}

/* ---------- birthday animation ---------- */
#celebrate{overflow:hidden;position:relative}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:2}
.title{font-size:clamp(2.6rem,10vw,6.5rem);font-weight:700;text-align:center;line-height:1.05;z-index:3;margin:0}
.title .row{display:block}
.title span{display:inline-block;opacity:0;transform:translateY(60px) rotate(-8deg) scale(.4);
  animation:pop .7s cubic-bezier(.2,1.6,.4,1) forwards, bob 2.4s ease-in-out infinite}
.title .gap{width:.35em}
.open{margin-top:34px;z-index:3;width:auto;opacity:0;pointer-events:none;transition:opacity .6s}
.open.show{opacity:1;pointer-events:auto}
.balloon{position:absolute;bottom:-160px;width:70px;height:88px;border-radius:50% 50% 48% 48%;z-index:1;
  animation:rise linear forwards}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:70px;background:rgba(74,35,64,.5)}
.balloon::before{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;
  border-bottom-color:inherit}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes rise{to{transform:translateY(-130vh) translateX(var(--drift,0px))}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- card + editor ---------- */
#cardScreen{justify-content:flex-start;padding-top:28px;gap:22px}
.layout{width:min(760px,100%)}
.card{background:var(--paper);border:3px solid var(--plum);border-radius:26px;box-shadow:8px 8px 0 var(--plum);
  overflow:hidden;transition:background .4s}
.card-text{padding:26px 30px 6px;text-align:center}
.card-text h2{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 6px;font-weight:700}
.card-text p{font-family:var(--hand);font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.25;margin:8px auto;max-width:34ch;white-space:pre-wrap}
.card-text .from{font-family:var(--hand);font-size:1.8rem;margin-top:6px}
.scene{display:block;width:100%;height:auto}
.hintline{text-align:center;font-size:.95rem;margin:0 0 12px;opacity:.7}
.editor{background:var(--cream);border:3px solid var(--plum);border-radius:22px;padding:20px;box-shadow:6px 6px 0 var(--plum)}
.editor h3{margin:0 0 10px;font-size:1.3rem}
.editor label{display:block;margin:12px 0 5px;font-weight:500}
.editor input[type=text],.editor textarea{width:100%;font:inherit;padding:10px 12px;border:2.5px solid var(--plum);border-radius:12px;background:#fff}
.editor textarea{min-height:110px;resize:vertical}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid var(--plum);padding:0}
.swatch[aria-pressed=true]{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--plum)}
.checks label{display:flex;gap:10px;align-items:center;font-weight:400;margin:8px 0}
.checks input{width:20px;height:20px;accent-color:var(--meadow)}
.row2{display:flex;gap:10px;margin-top:18px}
.row2 .btn{margin-top:0;font-size:1rem;padding:11px 10px}
.btn.ghost{background:#fff}
.status{min-height:1.3em;margin:10px 0 0;font-size:.95rem}

/* ---------- scene animation ---------- */
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flicker .35s ease-in-out infinite alternate}
.out .flame{opacity:0}
.smoke{opacity:0}
.out .smoke{animation:smoke 1.6s ease-out}
.cake{cursor:pointer}
.hop{animation:hop 1.7s ease-in-out infinite}
.hop.late{animation-delay:.85s}
.sway{animation:sway 3.6s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.15) rotate(3deg)}}
@keyframes hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-22px)}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<!-- 1. LOGIN -->
<main class="screen active" id="loginScreen">
  <div class="login">
    <svg class="sun" viewBox="-50 -50 100 100" aria-hidden="true">
      <g id="loginPetals"></g>
      <circle r="16" fill="#6d4126" stroke="#4a2340" stroke-width="2.5"/>
      <circle cx="-5" cy="-3" r="1.8" fill="#4a2340"/><circle cx="5" cy="-3" r="1.8" fill="#4a2340"/>
      <path d="M-6 4 Q0 10 6 4" stroke="#ffc21a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>Welcome! Log inside please :3</h1>
    <form id="loginForm" autocomplete="off">
      <label for="user">Username</label>
      <input id="user" name="username" type="text" autocomplete="username" required>
      <label for="pass">Password</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Log in</button>
      <p class="error" id="loginError" role="alert"></p>
    </form>
    <p class="hint">Your pass hint: <code>The nickname I gave you</code> / <code>your birthday in numbers only</code></p>
  </div>
</main>

<!-- 2. ANIMATED GREETING -->
<main class="screen" id="celebrate">
  <canvas id="confetti"></canvas>
  <h1 class="title" id="bigTitle" aria-label="Happy Birthday!"></h1>
  <button class="btn open" id="openCard">Touch me<3</button>
</main>

<!-- 3. CARD -->
<main class="screen" id="cardScreen">
  <div class="layout">
    <section>
      <div class="card" id="card">
        <div class="card-text">
          <h2 id="cardTitle"></h2>
          <p id="cardMessage"></p>
          <div class="from" id="cardFrom"></div>
        </div>
        <svg class="scene" id="scene" viewBox="0 0 700 420" role="img"
             aria-label="A birthday cake with sunflowers, a frog and a bunny"></svg>
        <p class="hintline">Click to blow me<3</p>
      </div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const THEMES = {
  pink:     {name:'Pink',     paper:'#fff1f5', sky:'#ffd9e6'},
  sky:      {name:'Sky',      paper:'#eef8ff', sky:'#bfe3ff'},
  mint:     {name:'Mint',     paper:'#effaf0', sky:'#c9efcf'},
  lavender: {name:'Lavender', paper:'#f6f0ff', sky:'#dccbff'},
  sunny:    {name:'Sunny',    paper:'#fffbe6', sky:'#ffeaa0'}
};
let card = {message:'Happy happy birthday to my Sweetest girl, My Matcha!! I never expected we would get this close, but now, talking to you is my favorite part of the day<3. I always look forward to hearing from you even on days when I am busy or tired. Your voice heals it all away. You have this sort of magic that allows me to calm down around you and I am sure your friends feel the same too! You are like sunshine embodied! I love you so so so sooo much and I wish I could be there for your Birthday but this is the best I can do for now :,). My wish for you is that you stay healthy, happy, safe, and you achieve all your dreams! You deserve the best my Sweet Girl<3 I Love Youuu', from:'Your Strawberry<3', theme:'pink', frog:true, bunny:true, flowers:true};

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0,0);
}

/* ---- sunflower pieces ---- */
function petals(count, rx, ry, dist, colorA, colorB){
  let out = '';
  for (let i = 0; i < count; i++){
    const a = (360 / count) * i;
    out += `<ellipse cx="0" cy="${-dist}" rx="${rx}" ry="${ry}" fill="${i % 2 ? colorA : colorB}" stroke="#4a2340" stroke-width="1.5" transform="rotate(${a})"/>`;
  }
  return out;
}
$('loginPetals').innerHTML = petals(12, 8, 17, 30, '#ffc21a', '#ffd54a');

function sunflower(x, y, s, delay){
  const base = 388;
  const mid = (base + y) / 2;
  return `
  <g class="sway" style="transform-origin:${x}px ${base}px;animation-delay:${delay}s">
    <path d="M${x} ${base} Q${x + 10} ${mid} ${x} ${y}" stroke="#3f8a3a" stroke-width="${7 * s}" fill="none" stroke-linecap="round"/>
    <ellipse cx="${x + 20 * s}" cy="${mid + 12}" rx="${22 * s}" ry="${9 * s}" fill="#6fbf4a" stroke="#2e6b2b" stroke-width="1.5" transform="rotate(-28 ${x + 20 * s} ${mid + 12})"/>
    <ellipse cx="${x - 20 * s}" cy="${mid + 40}" rx="${20 * s}" ry="${8 * s}" fill="#6fbf4a" stroke="#2e6b2b" stroke-width="1.5" transform="rotate(25 ${x - 20 * s} ${mid + 40})"/>
    <g transform="translate(${x} ${y}) scale(${s})">
      ${petals(14, 10, 22, 32, '#ffc21a', '#ffb300')}
      <circle r="24" fill="#6d4126" stroke="#4a2340" stroke-width="2"/>
      <circle r="14" fill="#53301b"/>
      <circle cx="-5" cy="-3" r="2" fill="#fff"/><circle cx="5" cy="-3" r="2" fill="#fff"/>
      <path d="M-7 6 Q0 12 7 6" stroke="#ffc21a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
  </g>`;
}

function frog(){
  return `
  <g transform="translate(190 352)"><g class="hop">
    <ellipse cx="-34" cy="26" rx="22" ry="9" fill="#5cae5f" stroke="#2e6b2b" stroke-width="2"/>
    <ellipse cx="34" cy="26" rx="22" ry="9" fill="#5cae5f" stroke="#2e6b2b" stroke-width="2"/>
    <ellipse cx="0" cy="-4" rx="48" ry="36" fill="#6ec271" stroke="#2e6b2b" stroke-width="2.5"/>
    <ellipse cx="0" cy="8" rx="30" ry="22" fill="#d4ecb0"/>
    <circle cx="-24" cy="-40" r="16" fill="#6ec271" stroke="#2e6b2b" stroke-width="2.5"/>
    <circle cx="24" cy="-40" r="16" fill="#6ec271" stroke="#2e6b2b" stroke-width="2.5"/>
    <circle cx="-24" cy="-42" r="10" fill="#fff"/><circle cx="24" cy="-42" r="10" fill="#fff"/>
    <circle cx="-22" cy="-42" r="5" fill="#4a2340"/><circle cx="26" cy="-42" r="5" fill="#4a2340"/>
    <circle cx="-35" cy="-8" r="6" fill="#ff9fb8" opacity=".8"/><circle cx="35" cy="-8" r="6" fill="#ff9fb8" opacity=".8"/>
    <path d="M-20 -12 Q0 6 20 -12" stroke="#2e6b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="-11,-52 11,-52 0,-92" fill="#ffc21a" stroke="#4a2340" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-94" r="6" fill="#ff7aa2" stroke="#4a2340" stroke-width="2"/>
    <path d="M-7 -66 L7 -66 M-4 -78 L4 -78" stroke="#ff7aa2" stroke-width="3" stroke-linecap="round"/>
  </g></g>`;
}

function bunny(){
  return `
  <g transform="translate(520 352)"><g class="hop late">
    <ellipse cx="-14" cy="-98" rx="11" ry="30" fill="#fff" stroke="#4a2340" stroke-width="2.5" transform="rotate(-8 -14 -98)"/>
    <ellipse cx="-14" cy="-98" rx="5.5" ry="22" fill="#ffb3c8" transform="rotate(-8 -14 -98)"/>
    <ellipse cx="16" cy="-98" rx="11" ry="30" fill="#fff" stroke="#4a2340" stroke-width="2.5" transform="rotate(10 16 -98)"/>
    <ellipse cx="16" cy="-98" rx="5.5" ry="22" fill="#ffb3c8" transform="rotate(10 16 -98)"/>
    <circle cx="40" cy="14" r="12" fill="#fff" stroke="#4a2340" stroke-width="2.5"/>
    <ellipse cx="-22" cy="28" rx="18" ry="9" fill="#fff" stroke="#4a2340" stroke-width="2.5"/>
    <ellipse cx="22" cy="28" rx="18" ry="9" fill="#fff" stroke="#4a2340" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="40" ry="34" fill="#fff" stroke="#4a2340" stroke-width="2.5"/>
    <circle cx="0" cy="-48" r="29" fill="#fff" stroke="#4a2340" stroke-width="2.5"/>
    <circle cx="-11" cy="-52" r="4" fill="#4a2340"/><circle cx="11" cy="-52" r="4" fill="#4a2340"/>
    <circle cx="-19" cy="-42" r="6" fill="#ffb3c8" opacity=".85"/><circle cx="19" cy="-42" r="6" fill="#ffb3c8" opacity=".85"/>
    <ellipse cx="0" cy="-45" rx="4" ry="3" fill="#ff7aa2"/>
    <path d="M0 -42 V-37 M0 -37 Q-6 -31 -11 -35 M0 -37 Q6 -31 11 -35" stroke="#4a2340" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-28 -46 L-42 -49 M-28 -41 L-42 -40 M28 -46 L42 -49 M28 -41 L42 -40" stroke="#4a2340" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-12 -20 L0 -14 L-12 -8 Z M12 -20 L0 -14 L12 -8 Z" fill="#ff7aa2" stroke="#4a2340" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="-14" r="4" fill="#ffc21a" stroke="#4a2340" stroke-width="1.8"/>
  </g></g>`;
}

function cake(){
  const candles = [[325,'#ff7aa2'],[350,'#5ec1ff'],[375,'#ffc21a']];
  let c = '';
  candles.forEach(([x, col], i) => {
    c += `<rect x="${x - 4}" y="232" width="8" height="34" rx="2" fill="${col}" stroke="#4a2340" stroke-width="2"/>
          <path d="M${x - 4} 244 L${x + 4} 252 M${x - 4} 256 L${x + 4} 264" stroke="#fff" stroke-width="2" opacity=".8"/>
          <g class="flame" style="animation-delay:${i * .12}s">
            <ellipse cx="${x}" cy="222" rx="6.5" ry="11" fill="#ff9800" stroke="#4a2340" stroke-width="1.5"/>
            <ellipse cx="${x}" cy="225" rx="3" ry="6" fill="#ffee58"/>
          </g>
          <path class="smoke" d="M${x} 224 q-6 -10 0 -18 q6 -8 0 -16" stroke="#9a8a9a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  });
  let waves = (n, w) => { let s = ''; for (let i = 0; i < n; i++) s += `q${-w / 2} ${w * .8} ${-w} 0 `; return s; };
  return `
  <g class="cake" id="cake" tabindex="0" role="button" aria-label="Blow out the candles">
    <ellipse cx="350" cy="376" rx="135" ry="15" fill="#fff" stroke="#4a2340" stroke-width="2.5"/>
    <rect x="262" y="310" width="176" height="66" rx="12" fill="#f78fb3" stroke="#4a2340" stroke-width="2.5"/>
    <path d="M262 322 H438 V312 H262 Z" fill="#fff"/>
    <path d="M262 314 H438 V324 ${waves(8, 22)} Z" fill="#fff" stroke="#4a2340" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="290" cy="350" r="4" fill="#ffc21a"/><circle cx="320" cy="360" r="4" fill="#5ec1ff"/>
    <circle cx="352" cy="348" r="4" fill="#fff"/><circle cx="384" cy="360" r="4" fill="#ffc21a"/>
    <circle cx="412" cy="348" r="4" fill="#5ec1ff"/>
    <rect x="296" y="266" width="108" height="48" rx="12" fill="#fbc2d6" stroke="#4a2340" stroke-width="2.5"/>
    <path d="M296 268 H404 V277 ${waves(6, 18)} Z" fill="#fff" stroke="#4a2340" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="350" cy="293" r="0"/>
    <path d="M318 296 q4 6 8 0 M342 298 q4 6 8 0 M366 296 q4 6 8 0" stroke="#4a2340" stroke-width="2" fill="none" stroke-linecap="round"/>
    ${c}
  </g>`;
}

function buildScene(){
  const th = THEMES[card.theme] || THEMES.pink;
  let s = `
  <defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${th.sky}" stop-opacity="0"/><stop offset="1" stop-color="${th.sky}"/></linearGradient></defs>
  <rect x="0" y="0" width="700" height="420" fill="url(#skyg)"/>
  <circle cx="620" cy="60" r="30" fill="#ffd54a" opacity=".75"/>
  <path d="M0 384 Q175 360 350 380 T700 374 V420 H0 Z" fill="#8bc34a" stroke="#4a2340" stroke-width="2.5"/>
  <path d="M0 404 Q175 390 350 402 T700 398 V420 H0 Z" fill="#6fae3a"/>`;
  if (card.flowers){
    s += sunflower(58, 225, 1.05, 0) + sunflower(122, 285, .8, .6) +
         sunflower(584, 270, .85, .3) + sunflower(646, 215, 1.1, .9);
  }
  if (card.frog) s += frog();
  if (card.bunny) s += bunny();
  s += cake();
  $('scene').innerHTML = s;
  const ck = $('cake');
  const toggle = () => $('scene').classList.toggle('out');
  ck.addEventListener('click', toggle);
  ck.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
}

function renderCard(){
  const th = THEMES[card.theme] || THEMES.pink;
  $('card').style.background = th.paper;
  $('cardTitle').textContent = 'Happy Birthday My Matcha!';
  $('cardMessage').textContent = card.message;
  $('cardFrom').textContent = card.from ? `With love, ${card.from}` : '';
  buildScene();
}

/* ---- login ---- */
const USERNAME = 'Matcha', PASSWORD = '1142006';
$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  $('loginError').textContent = '';
  if ($('user').value.trim() !== USERNAME || $('pass').value !== PASSWORD){
    $('loginError').textContent = 'That username or password is not right. Please try again.';
    return;
  }
  renderCard();
  startCelebration();
});

/* ---- celebration ---- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let confettiRun = 0;

function buildTitle(){
  const t = $('bigTitle'); t.innerHTML = '';
  const colors = ['#ff5d8f','#ffb300','#2fa8e0','#7cb342','#9b5de5','#ff7a45'];
  let n = 0;
  ['Happy','Birthday','Matcha!'].forEach(word => {
    const row = document.createElement('span'); row.className = 'row';
    [...word].forEach(ch => {
      const s = document.createElement('span'); s.textContent = ch; s.setAttribute('aria-hidden','true');
      s.style.color = colors[n % colors.length];
      s.style.animationDelay = `${n * .07}s, ${n * .07 + .8}s`;
      row.appendChild(s); n++;
    });
    t.appendChild(row);
  });
}

function balloons(){
  document.querySelectorAll('.balloon').forEach(b => b.remove());
  if (reduce) return;
  const cols = ['#ff7aa2','#ffc21a','#5ec1ff','#9be564','#c08bff','#ff9a5c'];
  for (let i = 0; i < 16; i++){
    const b = document.createElement('div'); b.className = 'balloon';
    b.style.left = (Math.random() * 94) + 'vw';
    b.style.background = cols[i % cols.length]; b.style.borderBottomColor = cols[i % cols.length];
    b.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    b.style.animationDuration = (6 + Math.random() * 5) + 's';
    b.style.animationDelay = (Math.random() * 3) + 's';
    $('celebrate').appendChild(b);
  }
}

function confetti(){
  const cv = $('confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const my = ++confettiRun;
  if (reduce) return;
  const cols = ['#ff5d8f','#ffc21a','#2fa8e0','#7cb342','#9b5de5','#ff7a45'];
  const bits = Array.from({length: 170}, () => ({
    x: Math.random() * cv.width, y: -Math.random() * cv.height,
    w: 7 + Math.random() * 7, h: 4 + Math.random() * 6,
    vy: 2 + Math.random() * 3.5, vx: Math.random() * 2 - 1,
    a: Math.random() * 6.28, va: Math.random() * .2 - .1, c: cols[(Math.random() * cols.length) | 0]
  }));
  const t0 = performance.now();
  (function frame(t){
    if (my !== confettiRun) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      if (p.y > cv.height + 20 && t - t0 < 9000){ p.y = -20; p.x = Math.random() * cv.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (t - t0 < 14000) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

function startCelebration(){
  show('celebrate');
  buildTitle(); balloons(); confetti();
  $('scene').classList.remove('out');
  const btn = $('openCard'); btn.classList.remove('show');
  setTimeout(() => btn.classList.add('show'), 2800);
}
$('openCard').addEventListener('click', () => { confettiRun++; show('cardScreen'); });
</script>
